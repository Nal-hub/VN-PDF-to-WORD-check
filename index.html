<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN PDF to Word - AI OCR & Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .document-preview { font-family: 'Times New Roman', serif; white-space: pre-wrap; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b pb-6">
            <div>
                <h1 class="text-2xl font-black text-blue-600 italic">VN PDF to Word</h1>
                <p class="text-slate-500 text-sm">AI OCR & Export to Docx</p>
            </div>
            <div id="action-buttons" class="flex gap-2 hidden">
                <button onclick="downloadWord()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-green-700 shadow-md transition flex items-center gap-2">
                    <i data-lucide="download" class="w-4 h-4"></i> Tải file Word
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="space-y-4">
                <div class="border-2 border-dashed border-slate-200 rounded-xl p-10 text-center bg-slate-50 hover:border-blue-400 transition-all cursor-pointer relative">
                    <input type="file" id="file-input" class="absolute inset-0 opacity-0 cursor-pointer" accept=".pdf">
                    <div class="flex flex-col items-center pointer-events-none">
                        <div class="w-14 h-14 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mb-3">
                            <i data-lucide="upload-cloud" class="w-7 h-7"></i>
                        </div>
                        <span class="font-bold text-slate-700">Tải tệp PDF lên</span>
                    </div>
                </div>
                <div id="file-info" class="hidden p-3 bg-blue-50 border border-blue-100 rounded-lg flex items-center gap-3">
                    <i data-lucide="file-text" class="w-5 h-5 text-blue-500"></i>
                    <span id="file-name" class="text-sm font-medium text-blue-800 truncate"></span>
                </div>
            </div>

            <div class="bg-slate-900 rounded-2xl p-1">
                <div class="bg-white rounded-xl p-5 min-h-[400px] max-h-[500px] overflow-y-auto">
                    <div id="status-bar" class="hidden mb-4 p-3 bg-slate-100 rounded-lg flex items-center gap-3">
                        <div class="loading-spinner"></div>
                        <span id="status-text" class="text-sm font-medium text-slate-600">Đang khởi tạo AI...</span>
                    </div>
                    <div id="preview-empty" class="h-full flex flex-col items-center justify-center py-20 text-slate-300">
                        <i data-lucide="file-search-2" class="w-12 h-12 mb-2 opacity-30"></i>
                        <p class="text-sm">Nội dung sẽ hiển thị tại đây</p>
                    </div>
                    <div id="preview-container" class="hidden">
                        <div id="preview-content" class="document-preview text-slate-700 text-sm leading-relaxed"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let extractedGlobalText = ""; // Lưu văn bản để tải về

        const fileInput = document.getElementById('file-input');
        const statusText = document.getElementById('status-text');
        const statusBar = document.getElementById('status-bar');
        const previewContent = document.getElementById('preview-content');
        const previewContainer = document.getElementById('preview-container');
        const previewEmpty = document.getElementById('preview-empty');
        const actionButtons = document.getElementById('action-buttons');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            actionButtons.classList.add('hidden');
            document.getElementById('file-info').classList.remove('hidden');
            document.getElementById('file-name').innerText = file.name;
            previewEmpty.classList.add('hidden');
            previewContainer.classList.remove('hidden');
            statusBar.classList.remove('hidden');
            previewContent.innerText = "";
            
            try {
                statusText.innerText = "Đang đọc PDF...";
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const page = await pdf.getPage(1);
                
                const textContent = await page.getTextContent();
                let rawText = textContent.items.map(s => s.str).join(" ");

                if (rawText.trim().length > 20) {
                    processResult(rawText);
                } else {
                    statusText.innerText = "Đang quét OCR (file scan)...";
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    const result = await Tesseract.recognize(canvas, 'vie');
                    processResult(result.data.text);
                }
            } catch (error) {
                statusText.innerText = "Lỗi xử lý file.";
            }
        });

        function processResult(text) {
            extractedGlobalText = text;
            previewContent.innerText = text;
            statusText.innerText = "Hoàn tất!";
            actionButtons.classList.remove('hidden');
            setTimeout(() => statusBar.classList.add('hidden'), 2000);
        }

        async function downloadWord() {
            if (!extractedGlobalText) return;

            const doc = new docx.Document({
                sections: [{
                    properties: {},
                    children: extractedGlobalText.split('\n').map(line => 
                        new docx.Paragraph({
                            children: [new docx.TextRun({ text: line, font: "Times New Roman", size: 24 })],
                        })
                    ),
                }],
            });

            const blob = await docx.Packer.toBlob(doc);
            saveAs(blob, "VN-Converted-Document.docx");
        }
    </script>
</body>
</html>
