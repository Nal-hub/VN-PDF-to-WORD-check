<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN PDF to Word - Giữ nguyên định dạng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .document-preview { 
            font-family: 'Times New Roman', serif; 
            white-space: pre-wrap; 
            line-height: 1.5;
            text-align: justify;
        }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-blue-600 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="file-check"></i> VN PDF to Word Pro
                </h1>
                <p class="text-blue-100 text-xs">Giữ tối đa định dạng & nội dung gốc</p>
            </div>
            <div id="action-buttons" class="hidden animate-bounce">
                <button onclick="downloadWord()" class="bg-white text-blue-600 px-6 py-2 rounded-full font-bold shadow-lg hover:bg-blue-50 transition flex items-center gap-2">
                    <i data-lucide="download"></i> TẢI FILE WORD (.DOCX)
                </button>
            </div>
        </div>

        <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="border-2 border-dashed border-slate-200 rounded-xl p-8 bg-slate-50 flex flex-col items-center justify-center min-h-[300px]">
                <input type="file" id="file-input" class="hidden" accept=".pdf">
                <label for="file-input" class="cursor-pointer text-center group">
                    <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4 group-hover:bg-blue-600 group-hover:text-white transition-all mx-auto">
                        <i data-lucide="upload" class="w-10 h-10"></i>
                    </div>
                    <p class="text-lg font-bold text-slate-700">Chọn file PDF cần chuyển đổi</p>
                    <p id="selected-name" class="text-sm text-blue-500 mt-2 italic"></p>
                </label>
            </div>

            <div class="bg-slate-800 rounded-xl p-4">
                <div id="status-container" class="hidden mb-4 bg-blue-500/10 border border-blue-500/20 p-3 rounded-lg flex items-center gap-3">
                    <div class="w-4 h-4 border-2 border-blue-500 border-t-transparent animate-spin rounded-full"></div>
                    <span id="status-text" class="text-blue-400 text-sm font-medium">Đang xử lý...</span>
                </div>
                <div id="preview-box" class="bg-white rounded-lg p-6 min-h-[400px] max-h-[600px] overflow-y-auto">
                    <div id="preview-content" class="document-preview text-slate-800 text-sm">
                        <div class="h-full flex flex-col items-center justify-center py-20 text-slate-300">
                            <i data-lucide="layout" class="w-12 h-12 mb-2 opacity-20"></i>
                            <p>Bản xem trước định dạng sẽ hiện ở đây</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let finalLines = []; 

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('selected-name').innerText = file.name;
            document.getElementById('status-container').classList.remove('hidden');
            document.getElementById('action-buttons').classList.add('hidden');
            const preview = document.getElementById('preview-content');
            preview.innerText = "";
            finalLines = [];

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                
                // Duyệt qua tất cả các trang để giữ nguyên nội dung
                for (let i = 1; i <= pdf.numPages; i++) {
                    document.getElementById('status-text').innerText = `Đang xử lý trang ${i}/${pdf.numPages}...`;
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    // Sắp xếp lại text theo tọa độ Y để giữ dòng
                    const items = textContent.items.sort((a, b) => b.transform[5] - a.transform[5] || a.transform[4] - b.transform[4]);
                    
                    let lastY = -1;
                    let pageText = "";
                    
                    if (items.length > 5) { // PDF có text
                        items.forEach(item => {
                            if (lastY !== -1 && Math.abs(item.transform[5] - lastY) > 5) {
                                pageText += "\n";
                            }
                            pageText += item.str + " ";
                            lastY = item.transform[5];
                        });
                    } else { // Xử lý OCR nếu là file scan
                        const viewport = page.getViewport({ scale: 2.0 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        
                        const result = await Tesseract.recognize(canvas, 'vie');
                        pageText = result.data.text;
                    }
                    
                    finalLines.push(...pageText.split('\n'));
                    preview.innerText += pageText + "\n--- Trang " + i + " ---\n";
                }

                document.getElementById('status-container').classList.add('hidden');
                document.getElementById('action-buttons').classList.remove('hidden');

            } catch (error) {
                document.getElementById('status-text').innerText = "Lỗi định dạng PDF.";
            }
        });

        async function downloadWord() {
            const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;

            const doc = new Document({
                sections: [{
                    properties: {
                        page: { margin: { top: 720, right: 720, bottom: 720, left: 720 } }
                    },
                    children: finalLines.map(line => 
                        new Paragraph({
                            alignment: AlignmentType.JUSTIFIED,
                            children: [
                                new TextRun({
                                    text: line,
                                    font: "Times New Roman",
                                    size: 26, // Tương đương 13pt chuẩn Việt Nam
                                }),
                            ],
                            spacing: { line: 360 }, // Giữ giãn dòng chuẩn
                        })
                    ),
                }],
            });

            const blob = await Packer.toBlob(doc);
            saveAs(blob, "Tai-Lieu-Goc.docx");
        }
    </script>
</body>
</html>
