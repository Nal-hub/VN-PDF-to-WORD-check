<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chuyển đổi PDF Hành chính chuẩn - Bộ Tư Pháp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .page-view { background: white; width: 210mm; min-height: 297mm; padding: 20mm; margin: 20px auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); font-family: "Times New Roman", serif; position: relative; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mb-6">
        <h2 class="text-xl font-bold text-blue-700 mb-2">HỆ THỐNG CHUYỂN ĐỔI PDF SANG WORD CHUẨN</h2>
        <p class="text-slate-500 text-sm mb-6">Tối ưu riêng cho mẫu văn bản hành chính Việt Nam (Giữ nguyên định dạng 2 cột, tiêu ngữ)</p>
        
        <div class="flex items-center gap-4">
            <input type="file" id="pdf-input" class="hidden" accept=".pdf">
            <label for="pdf-input" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold cursor-pointer hover:bg-blue-700 transition">TẢI FILE PDF MẪU</label>
            <button id="download-btn" class="hidden bg-green-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-green-700 transition">XUẤT WORD (.DOCX)</button>
        </div>
        <div id="loading" class="hidden mt-4 text-blue-600 font-medium animate-pulse">Đang quét tọa độ và giữ nguyên định dạng...</div>
    </div>

    <div id="preview-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        let extractedData = [];

        document.getElementById('pdf-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('loading').classList.remove('hidden');
            const container = document.getElementById('preview-container');
            container.innerHTML = "";
            extractedData = [];

            const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
            
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                // Thuật toán sắp xếp văn bản theo tọa độ thực (X, Y) để không bị nhảy chữ
                const items = textContent.items.sort((a, b) => {
                    if (Math.abs(a.transform[5] - b.transform[5]) < 5) return a.transform[4] - b.transform[4];
                    return b.transform[5] - a.transform[5];
                });

                let lastY = -1;
                let pageRows = [];
                let currentRow = "";

                items.forEach(item => {
                    if (lastY !== -1 && Math.abs(item.transform[5] - lastY) > 5) {
                        pageRows.push(currentRow);
                        currentRow = "";
                    }
                    currentRow += item.str + " ";
                    lastY = item.transform[5];
                });
                pageRows.push(currentRow);
                extractedData.push(pageRows);

                // Hiển thị Preview
                const pageDiv = document.createElement('div');
                pageDiv.className = "page-view";
                pageDiv.innerHTML = pageRows.map(r => `<p style="min-height:1.2em">${r}</p>`).join('');
                container.appendChild(pageDiv);
            }
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('download-btn').classList.remove('hidden');
        };

        async function exportDoc() {
            const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;
            const sections = extractedData.map(rows => ({
                properties: { page: { margin: { top: 1134, right: 850, bottom: 1134, left: 1700 } } },
                children: rows.map(text => {
                    let align = AlignmentType.LEFT;
                    // Tự động căn giữa nếu là Quốc hiệu hoặc Kế hoạch
                    if (text.includes("CỘNG HÒA") || text.includes("KẾ HOẠCH") || text.includes("Độc lập")) align = AlignmentType.CENTER;
                    
                    return new Paragraph({
                        alignment: align,
                        children: [new TextRun({ text: text, font: "Times New Roman", size: 26 })],
                        spacing: { line: 360, after: 120 }
                    });
                })
            }));

            const doc = new Document({ sections });
            const blob = await Packer.toBlob(doc);
            saveAs(blob, "Van_Ban_Bo_Tu_Phap_Chuan.docx");
        }

        document.getElementById('download-btn').onclick = exportDoc;
    </script>
</body>
</html>
