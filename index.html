<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN PDF to Word - Giữ nguyên định dạng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .document-preview { font-family: 'Times New Roman', serif; white-space: pre-wrap; line-height: 1.5; text-align: justify; }
        .page-break { border-top: 2px dashed #e2e8f0; margin: 20px 0; position: relative; }
        .page-label { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #f8fafc; padding: 0 10px; font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i data-lucide="file-text" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-none">VN PDF to Word</h1>
                    <p class="text-xs text-slate-500 mt-1">Chuyển đổi giữ nguyên cấu trúc văn bản</p>
                </div>
            </div>
            <div id="action-area" class="hidden flex gap-3">
                <button onclick="downloadWord()" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition flex items-center gap-2">
                    <i data-lucide="download" class="w-4 h-4"></i> XUẤT FILE WORD
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-4">
                <div class="border-2 border-dashed border-slate-200 rounded-2xl p-8 bg-white hover:border-blue-400 transition-all cursor-pointer group text-center relative">
                    <input type="file" id="file-input" class="absolute inset-0 opacity-0 cursor-pointer" accept=".pdf">
                    <div class="pointer-events-none">
                        <i data-lucide="cloud-upload" class="w-12 h-12 text-slate-300 group-hover:text-blue-500 transition mx-auto mb-3"></i>
                        <p class="font-bold text-slate-700">Chọn file PDF</p>
                        <p class="text-xs text-slate-400 mt-1">Hỗ trợ cả file văn bản và file scan</p>
                    </div>
                </div>
                <div id="status-card" class="hidden p-4 bg-white rounded-xl border border-slate-100 shadow-sm space-y-3">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></div>
                        <span id="status-text" class="text-sm font-medium text-slate-600">Đang khởi tạo...</span>
                    </div>
                    <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="bg-slate-800 rounded-2xl p-1 shadow-2xl">
                    <div class="bg-white rounded-xl p-8 min-h-[500px] max-h-[700px] overflow-y-auto" id="preview-scroll">
                        <div id="preview-empty" class="h-full flex flex-col items-center justify-center py-24 text-slate-300">
                            <i data-lucide="scan-line" class="w-16 h-16 mb-4 opacity-10"></i>
                            <p class="font-medium">Nội dung sau chuyển đổi sẽ hiển thị tại đây</p>
                        </div>
                        <div id="preview-content" class="document-preview text-slate-800 text-base"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let allPagesContent = [];

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Reset UI
            allPagesContent = [];
            document.getElementById('preview-content').innerHTML = "";
            document.getElementById('preview-empty').classList.add('hidden');
            document.getElementById('status-card').classList.remove('hidden');
            document.getElementById('action-area').classList.add('hidden');
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const totalPages = pdf.numPages;

                for (let i = 1; i <= totalPages; i++) {
                    const progress = (i / totalPages) * 100;
                    document.getElementById('progress-bar').style.width = `${progress}%`;
                    document.getElementById('status-text').innerText = `Đang xử lý trang ${i}/${totalPages}...`;

                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    // Sắp xếp tọa độ để giữ định dạng dòng
                    const items = textContent.items.sort((a, b) => b.transform[5] - a.transform[5] || a.transform[4] - b.transform[4]);
                    
                    let lastY = -1;
                    let pageText = "";
                    
                    if (items.length > 5) {
                        items.forEach(item => {
                            if (lastY !== -1 && Math.abs(item.transform[5] - lastY) > 5) pageText += "\n";
                            pageText += item.str + " ";
                            lastY = item.transform[5];
                        });
                    } else {
                        // OCR cho trang scan
                        const viewport = page.getViewport({ scale: 2.0 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        const result = await Tesseract.recognize(canvas, 'vie');
                        pageText = result.data.text;
                    }

                    allPagesContent.push(pageText);
                    
                    // Hiển thị preview từng trang
                    const pageDiv = document.createElement('div');
                    pageDiv.className = "mb-8";
                    pageDiv.innerText = pageText;
                    if (i < totalPages) {
                        const hr = document.createElement('div');
                        hr.className = "page-break";
                        hr.innerHTML = `<span class="page-label">TRANG ${i+1}</span>`;
                        pageDiv.appendChild(hr);
                    }
                    document.getElementById('preview-content').appendChild(pageDiv);
                }

                document.getElementById('status-text').innerText = "Chuyển đổi hoàn tất!";
                document.getElementById('action-area').classList.remove('hidden');
                setTimeout(() => document.getElementById('status-card').classList.add('hidden'), 2000);

            } catch (err) {
                document.getElementById('status-text').innerText = "Lỗi: " + err.message;
            }
        });

        async function downloadWord() {
            const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;

            const children = [];
            allPagesContent.forEach((content, index) => {
                const lines = content.split('\n');
                lines.forEach(line => {
                    children.push(new Paragraph({
                        alignment: AlignmentType.JUSTIFIED,
                        children: [new TextRun({ text: line, font: "Times New Roman", size: 26 })],
                        spacing: { line: 360, after: 120 }
                    }));
                });
                // Thêm ngắt trang trong Word nếu không phải trang cuối
                if (index < allPagesContent.length - 1) {
                    children.push(new Paragraph({ children: [new TextRun({ text: "", break: 1 })] }));
                }
            });

            const doc = new Document({ sections: [{ properties: {}, children: children }] });
            const blob = await Packer.toBlob(doc);
            saveAs(blob, "Luu-Tru-Van-Ban.docx");
        }
    </script>
</body>
</html>
