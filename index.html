<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN PDF to Word - AI Powered (OCR)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .document-preview { font-family: 'Times New Roman', serif; white-space: pre-wrap; }
        .loading-spinner { border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 md:p-10">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">VN PDF to Word</h1>
                <p class="text-slate-500 font-medium">Hỗ trợ AI & Nhận diện file Scan (OCR)</p>
            </div>
            <div class="flex gap-2">
                <button class="bg-slate-800 text-white px-5 py-2.5 rounded-xl hover:bg-slate-700 transition font-medium text-sm">Hướng dẫn</button>
                <button class="bg-blue-600 text-white px-5 py-2.5 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200 font-medium text-sm">Lấy Key AI</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5 space-y-6">
                <div class="border-3 border-dashed border-slate-200 rounded-2xl p-8 text-center bg-slate-50 hover:bg-white hover:border-blue-400 transition-all group">
                    <input type="file" id="file-input" class="hidden" accept=".pdf">
                    <label for="file-input" class="cursor-pointer block">
                        <div class="flex flex-col items-center">
                            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition">
                                <i data-lucide="file-digit" class="w-8 h-8"></i>
                            </div>
                            <span class="text-lg font-bold text-slate-700">Tải PDF hoặc Ảnh Scan</span>
                            <p class="text-sm text-slate-400 mt-2">Hệ thống sẽ tự động nhận diện chữ trong hình ảnh</p>
                        </div>
                    </label>
                </div>
                <div id="file-list"></div>
            </div>

            <div class="lg:col-span-7">
                <div class="bg-slate-900 rounded-2xl p-1 shadow-inner">
                    <div class="bg-white rounded-xl p-6 min-h-[400px] max-h-[600px] overflow-y-auto border border-slate-200">
                        <div id="status-display" class="hidden mb-4 p-3 bg-blue-50 text-blue-700 rounded-lg text-sm font-medium flex items-center">
                            <div class="w-4 h-4 border-2 border-blue-200 loading-spinner rounded-full mr-3"></div>
                            <span id="status-text">Đang chuẩn bị...</span>
                        </div>
                        
                        <div id="preview-empty" class="h-full flex flex-col items-center justify-center py-20 text-slate-300">
                            <i data-lucide="scan-text" class="w-16 h-16 mb-4 opacity-20"></i>
                            <p class="font-medium">Chưa có dữ liệu để hiển thị</p>
                        </div>

                        <div id="preview-container" class="hidden">
                            <div id="preview-content" class="document-preview text-slate-800 leading-relaxed text-base"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const fileInput = document.getElementById('file-input');
        const statusDisplay = document.getElementById('status-display');
        const statusText = document.getElementById('status-text');
        const previewContent = document.getElementById('preview-content');
        const previewContainer = document.getElementById('preview-container');
        const previewEmpty = document.getElementById('preview-empty');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Reset UI
            previewEmpty.classList.add('hidden');
            previewContainer.classList.remove('hidden');
            statusDisplay.classList.remove('hidden');
            previewContent.innerText = "";
            
            try {
                statusText.innerText = "🔍 Đang kiểm tra định dạng PDF...";
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let extractedText = "";

                // Thử trích xuất văn bản thô trước (cho nhanh)
                const page = await pdf.getPage(1);
                const textContent = await page.getTextContent();
                let rawText = textContent.items.map(s => s.str).join(" ");

                if (rawText.trim().length > 10) {
                    statusText.innerText = "✅ Đã trích xuất văn bản thành công!";
                    extractedText = rawText;
                } else {
                    // NẾU LÀ FILE SCAN -> BẮT ĐẦU CHẠY OCR
                    statusText.innerText = "🖼️ Phát hiện file Scan. Đang kích hoạt AI OCR (có thể mất 10-20 giây)...";
                    
                    // Chuyển PDF trang 1 thành ảnh để OCR
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    const imageData = canvas.toDataURL('image/png');

                    // Chạy Tesseract OCR
                    const worker = await Tesseract.createWorker('vie+eng'); // Nhận diện cả tiếng Việt và Anh
                    const ret = await worker.recognize(imageData);
                    extractedText = ret.data.text;
                    await worker.terminate();
                }

                previewContent.innerText = extractedText || "Không thể nhận diện được chữ trong file này.";
                statusDisplay.classList.add('hidden');

            } catch (error) {
                statusText.innerText = "❌ Lỗi: " + error.message;
                console.error(error);
            }
        });
    </script>
</body>
</html>
