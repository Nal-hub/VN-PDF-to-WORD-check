<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN PDF to Word - Cấu trúc Hành chính</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .preview-container { font-family: 'Times New Roman', serif; line-height: 1.3; }
        .page-shadow { shadow-lg; border: 1px solid #e2e8f0; margin-bottom: 2rem; background: white; padding: 2.5cm 1.5cm; min-height: 29.7cm; width: 21cm; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body class="py-10">

    <div class="max-w-6xl mx-auto px-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tight">Hệ thống Chuyển đổi Văn bản</h1>
                    <p class="text-slate-500 text-sm">Chuyên dụng cho văn bản hành chính Việt Nam</p>
                </div>
                
                <div class="flex items-center gap-4">
                    <input type="file" id="pdf-upload" class="hidden" accept=".pdf">
                    <label for="pdf-upload" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold cursor-pointer flex items-center gap-2 transition-all">
                        <i data-lucide="file-plus"></i> CHỌN FILE PDF
                    </label>
                    <button id="btn-download" class="hidden bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 transition-all shadow-lg shadow-green-100">
                        <i data-lucide="save"></i> TẢI FILE WORD (.DOCX)
                    </button>
                </div>
            </div>
            
            <div id="status" class="mt-6 hidden">
                <div class="flex items-center gap-3 p-3 bg-blue-50 rounded-lg text-blue-700 text-sm font-medium">
                    <div class="animate-spin rounded-full h-4 w-4 border-2 border-blue-600 border-t-transparent"></div>
                    <span id="status-msg">Đang phân tích cấu trúc tọa độ văn bản...</span>
                </div>
            </div>
        </div>

        <div id="preview-area" class="preview-container hidden animate-fade-in">
            </div>
    </div>

    <script>
        lucide.createIcons();
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let docData = []; // Lưu trữ dữ liệu cấu trúc

        document.getElementById('pdf-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').classList.remove('hidden');
            const previewArea = document.getElementById('preview-area');
            previewArea.innerHTML = "";
            previewArea.classList.remove('hidden');
            docData = [];

            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;

            for (let i = 1; i <= pdf.numPages; i++) {
                document.getElementById('status-msg').innerText = `Đang dựng lại trang ${i}/${pdf.numPages}...`;
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                // Thuật toán sắp xếp tọa độ Y (từ trên xuống) và X (từ trái sang)
                // Giúp giữ nguyên vị trí Quốc hiệu, Tiêu ngữ và Nội dung
                const items = textContent.items.sort((a, b) => {
                    if (Math.abs(a.transform[5] - b.transform[5]) < 5) {
                        return a.transform[4] - b.transform[4];
                    }
                    return b.transform[5] - a.transform[5];
                });

                let lastY = -1;
                let pageLines = [];
                let currentLine = "";

                items.forEach(item => {
                    if (lastY !== -1 && Math.abs(item.transform[5] - lastY) > 5) {
                        pageLines.push(currentLine.trim());
                        currentLine = "";
                    }
                    currentLine += item.str + " ";
                    lastY = item.transform[5];
                });
                pageLines.push(currentLine.trim());
                docData.push(pageLines);

                // Dựng giao diện xem trước (Preview)
                const pageDiv = document.createElement('div');
                pageDiv.className = "page-shadow";
                pageDiv.innerHTML = pageLines.map(line => `<p class="min-h-[1.2em] mb-1">${line}</p>`).join('');
                previewArea.appendChild(pageDiv);
            }

            document.getElementById('status').classList.add('hidden');
            document.getElementById('btn-download').classList.remove('hidden');
        });

        async function downloadWord() {
            const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;
            
            const sections = docData.map(pageLines => ({
                properties: {
                    page: { margin: { top: 1134, right: 850, bottom: 1134, left: 1700 } } // Margin chuẩn 2cm-1.5cm-2cm-3cm
                },
                children: pageLines.map(line => {
                    // Tự động nhận diện căn giữa cho tiêu đề (Quốc hiệu, Kế hoạch...)
                    let alignment = AlignmentType.LEFT;
                    if (line.length < 60 && (line === line.toUpperCase() || line.includes("Độc lập"))) {
                        alignment = AlignmentType.CENTER;
                    }

                    return new Paragraph({
                        alignment: alignment,
                        children: [
                            new TextRun({
                                text: line,
                                font: "Times New Roman",
                                size: 26, // Cỡ chữ 13pt chuẩn
                                bold: line === line.toUpperCase() && line.length > 5
                            })
                        ],
                        spacing: { line: 360, after: 120 }
                    });
                })
            }));

            const doc = new Document({ sections });
            const blob = await Packer.toBlob(doc);
            saveAs(blob, "Van-Ban-Chuyen-Doi-Chuan.docx");
        }

        document.getElementById('btn-download').onclick = downloadWord;
    </script>
</body>
</html>
