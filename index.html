<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chuyển đổi PDF sang Word - Bộ Tư Pháp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .pdf-page { 
            background: white; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); 
            margin: 20px auto; 
            padding: 2cm; 
            width: 210mm; 
            min-height: 297mm;
            font-family: "Times New Roman", Times, serif;
            font-size: 13pt;
            line-height: 1.3;
        }
    </style>
</head>
<body class="p-5 md:p-10">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-sm border mb-6">
        <h1 class="text-xl font-bold text-slate-800 mb-4">HỆ THỐNG CHUYỂN ĐỔI VĂN BẢN CHUẨN</h1>
        <div class="flex gap-4">
            <input type="file" id="pdf-file" class="hidden" accept=".pdf">
            <label for="pdf-file" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold cursor-pointer hover:bg-blue-700 transition">
                Chọn file PDF
            </label>
            <button id="btn-export" class="hidden bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition">
                Tải file Word (.docx)
            </button>
        </div>
        <div id="msg" class="mt-4 text-sm text-blue-600 hidden">Đang xử lý tọa độ văn bản...</div>
    </div>

    <div id="preview-area"></div>

    <script>
        // Cấu hình worker để không bị lỗi trắng trang
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let allTextData = [];

        document.getElementById('pdf-file').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('msg').classList.remove('hidden');
            const preview = document.getElementById('preview-area');
            preview.innerHTML = "";
            allTextData = [];

            try {
                const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    
                    // Sắp xếp theo dòng (Y) và cột (X) để giữ Quốc hiệu/Tiêu ngữ chuẩn 
                    const sortedItems = content.items.sort((a, b) => {
                        if (Math.abs(a.transform[5] - b.transform[5]) < 5) return a.transform[4] - b.transform[4];
                        return b.transform[5] - a.transform[5];
                    });

                    let lastY = -1;
                    let lines = [];
                    let curLine = "";

                    sortedItems.forEach(item => {
                        if (lastY !== -1 && Math.abs(item.transform[5] - lastY) > 5) {
                            lines.push(curLine);
                            curLine = "";
                        }
                        curLine += item.str + " ";
                        lastY = item.transform[5];
                    });
                    lines.push(curLine);
                    allTextData.push(lines);

                    // Hiển thị preview
                    const div = document.createElement('div');
                    div.className = "pdf-page";
                    div.innerHTML = lines.map(l => `<p class="min-h-[1.2em]">${l}</p>`).join('');
                    preview.appendChild(div);
                }
                
                document.getElementById('msg').innerText = "Đã phân tích xong!";
                document.getElementById('btn-export').classList.remove('hidden');
            } catch (err) {
                alert("Lỗi: " + err.message);
            }
        };

        document.getElementById('btn-export').onclick = async () => {
            const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;
            const sections = allTextData.map(lines => ({
                properties: { page: { margin: { top: 1134, left: 1417, bottom: 1134, right: 850 } } },
                children: lines.map(l => {
                    let align = AlignmentType.LEFT;
                    // Tự động căn giữa Tiêu ngữ và Tên kế hoạch [cite: 5, 6]
                    if (l.includes("CỘNG HÒA") || l.includes("KẾ HOẠCH") || l.includes("Độc lập")) align = AlignmentType.CENTER;
                    
                    return new Paragraph({
                        alignment: align,
                        children: [new TextRun({ text: l, font: "Times New Roman", size: 26 })],
                        spacing: { line: 360 }
                    });
                })
            }));

            const blob = await Packer.toBlob(new Document({ sections }));
            saveAs(blob, "Ket-qua-chuyen-doi.docx");
        };
    </script>
</body>
</html>
