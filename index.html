<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

<script>
// Cấu hình PDF.js
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

async function showPreview(file) {
    previewEmpty.classList.add('hidden');
    previewContainer.classList.remove('hidden');
    document.getElementById('preview-title').innerText = file.name;
    const contentDiv = document.getElementById('preview-content');
    
    contentDiv.innerText = "⚡ Đang trích xuất văn bản từ PDF...";

    try {
        // Đọc file PDF
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        let fullText = "";

        // Chỉ đọc trang đầu tiên để demo cho nhanh (có thể sửa thành vòng lặp để đọc hết)
        const page = await pdf.getPage(1);
        const textContent = await page.getTextContent();
        fullText = textContent.items.map(s => s.str).join(" ");

        contentDiv.innerText = fullText.substring(0, 500) + "... (Đã trích xuất xong)";
        
        // GỌI AI TẠI ĐÂY
        // processWithAI(fullText); 

    } catch (error) {
        contentDiv.innerText = "❌ Lỗi: Không thể đọc file PDF này.";
        console.error(error);
    }
}
</script>
