<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>VN PDF to Word - Chuẩn Văn Bản Hành Chính</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .document-preview { 
            background: white; width: 210mm; min-height: 297mm; 
            padding: 2.5cm 1.5cm 2cm 3cm; margin: 20px auto; 
            font-family: "Times New Roman", serif; font-size: 14pt;
            box-shadow: 0 0 20px rgba(0,0,0,0.1); line-height: 1.5;
        }
        .bold { font-weight: bold; }
        .uppercase { text-transform: uppercase; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-sm mb-6 border border-slate-200">
        <h1 class="text-xl font-black text-blue-800 mb-4">CHUYỂN ĐỔI PDF CHUẨN ĐỊNH DẠNG (FONT 14)</h1>
        <div class="flex gap-4">
            <input type="file" id="pdf-file" class="hidden" accept=".pdf">
            <label for="pdf-file" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold cursor-pointer hover:bg-blue-700 transition shadow-lg">Tải PDF Lên</label>
            <button id="btn-word" class="hidden bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg">Xuất File Word (.docx)</button>
        </div>
        <p id="status" class="mt-4 text-sm font-medium text-blue-600 hidden"></p>
    </div>

    <div id="preview"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let structuredPages = [];

        document.getElementById('pdf-input')?.remove(); // Dọn dẹp id cũ nếu có
        document.getElementById('pdf-file').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('status');
            const preview = document.getElementById('preview');
            status.innerText = "🔄 Đang trích xuất định dạng in đậm, in hoa...";
            status.classList.remove('hidden');
            preview.innerHTML = "";
            structuredPages = [];

            const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                // Thuật toán quét tọa độ cực nhanh để không bị mất dữ liệu
                const items = textContent.items.sort((a, b) => {
                    if (Math.abs(a.transform[5] - b.transform[5]) < 5) return a.transform[4] - b.transform[4];
                    return b.transform[5] - a.transform[5];
                });

                let lastY = -1;
                let pageData = [];
                let currentLine = [];

                items.forEach(item => {
                    if (lastY !== -1 && Math.abs(item.transform[5] - lastY) > 5) {
                        pageData.push(currentLine);
                        currentLine = [];
                    }
                    // Lưu cả nội dung và thuộc tính định dạng
                    currentLine.push({
                        text: item.str,
                        bold: item.fontName.toLowerCase().includes('bold') || item.str === item.str.toUpperCase() && item.str.length > 3,
                        x: item.transform[4]
                    });
                    lastY = item.transform[5];
                });
                pageData.push(currentLine);
                structuredPages.push(pageData);

                // Dựng Preview cho người dùng xem trước
                const div = document.createElement('div');
                div.className = "document-preview";
                div.innerHTML = pageData.map(line => {
                    const lineText = line.map(chunk => `<span class="${chunk.bold ? 'bold' : ''}">${chunk.text}</span>`).join(' ');
                    return `<p style="min-height:1.2em">${lineText}</p>`;
                }).join('');
                preview.appendChild(div);
            }
            
            status.innerText = "✅ Đã xử lý xong định dạng!";
            document.getElementById('btn-word').classList.remove('hidden');
        };

        document.getElementById('btn-word').onclick = async () => {
            const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;
            
            const sections = structuredPages.map(page => ({
                properties: { 
                    page: { margin: { top: 1134, left: 1700, bottom: 1134, right: 850 } } 
                },
                children: page.map(line => {
                    let fullLineText = line.map(c => c.text).join(" ");
                    let align = AlignmentType.LEFT;
                    
                    // Căn giữa cho Quốc hiệu, Tiêu ngữ, Tên kế hoạch
                    if (fullLineText.includes("CỘNG HÒA") || fullLineText.includes("KẾ HOẠCH") || fullLineText.includes("Độc lập")) {
                        align = AlignmentType.CENTER;
                    }

                    return new Paragraph({
                        alignment: align,
                        children: line.map(chunk => new TextRun({
                            text: chunk.text + " ",
                            bold: chunk.bold,
                            font: "Times New Roman",
                            size: 28, // Size 28 trong docx.js = 14pt trong Word
                        })),
                        spacing: { line: 360, before: 100 }
                    });
                })
            }));

            const blob = await Packer.toBlob(new Document({ sections }));
            saveAs(blob, "Ke_Hoach_Bo_Tu_Phap_Chuan.docx");
        };
    </script>
</body>
</html>
