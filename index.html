<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống OCR PDF sang Word - Bộ Tư Pháp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .preview-box { background: white; width: 210mm; padding: 2cm; margin: 20px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); font-family: "Times New Roman", serif; font-size: 14pt; line-height: 1.5; color: #000; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
        <h1 class="text-2xl font-black text-blue-900 mb-2 uppercase">Chuyển đổi PDF Scan sang Word</h1>
        <p class="text-slate-500 text-sm mb-6 underline font-medium">Tự động nhận diện chữ trong ảnh - Giữ định dạng Font 14</p>
        
        <div class="flex items-center gap-4">
            <input type="file" id="pdf-file" class="hidden" accept=".pdf">
            <label for="pdf-file" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold cursor-pointer hover:bg-blue-700 transition flex items-center gap-2">
                CHỌN FILE PDF
            </label>
            <button id="btn-export" class="hidden bg-emerald-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-emerald-700 shadow-lg flex items-center gap-2">
                TẢI WORD (.DOCX)
            </button>
        </div>

        <div id="loading" class="hidden mt-6 p-4 bg-blue-50 rounded-2xl flex items-center gap-4 border border-blue-100">
            <div class="spinner"></div>
            <span id="load-text" class="text-blue-700 font-bold text-sm italic">Đang dùng AI quét chữ tiếng Việt... 0%</span>
        </div>
    </div>

    <div id="preview"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let extractedData = [];

        document.getElementById('pdf-file').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const loading = document.getElementById('loading');
            const loadText = document.getElementById('load-text');
            const preview = document.getElementById('preview');
            const btn = document.getElementById('btn-export');

            loading.classList.remove('hidden');
            btn.classList.add('hidden');
            preview.innerHTML = "";
            extractedData = [];

            try {
                const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                const scheduler = Tesseract.createScheduler();
                const worker = await Tesseract.createWorker('vie'); // Ngôn ngữ Tiếng Việt
                scheduler.addWorker(worker);

                for (let i = 1; i <= pdf.numPages; i++) {
                    loadText.innerText = `Đang quét AI trang ${i}/${pdf.numPages}... (Vui lòng đợi)`;
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 }); // Tăng độ phân giải để quét chuẩn
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    // Thực hiện OCR nhận diện chữ
                    const { data: { lines } } = await scheduler.addJob('recognize', canvas);
                    
                    const pageContent = lines.map(line => ({
                        text: line.text.trim(),
                        isBold: line.text.trim() === line.text.trim().toUpperCase() && line.text.length > 5,
                        confidence: line.confidence
                    }));

                    extractedData.push(pageContent);

                    // Hiển thị xem trước
                    const div = document.createElement('div');
                    div.className = "preview-box";
                    div.innerHTML = pageContent.map(l => `<p style="min-height:1.2em; font-weight:${l.isBold ? 'bold' : 'normal'}">${l.text}</p>`).join('');
                    preview.appendChild(div);
                }

                await scheduler.terminate();
                loadText.innerText = "✅ Đã quét xong! Nội dung đã sẵn sàng.";
                btn.classList.remove('hidden');
            } catch (err) {
                alert("Lỗi OCR: " + err.message);
                console.error(err);
            }
        };

        document.getElementById('btn-export').onclick = async () => {
            const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;
            
            const sections = extractedData.map(pageLines => ({
                properties: { page: { margin: { top: 1134, left: 1700, bottom: 1134, right: 850 } } },
                children: pageLines.map(line => {
                    let align = AlignmentType.LEFT;
                    if (line.text.includes("CỘNG HÒA") || line.text.includes("KẾ HOẠCH") || line.text.includes("Độc lập")) {
                        align = AlignmentType.CENTER;
                    }

                    return new Paragraph({
                        alignment: align,
                        children: [new TextRun({
                            text: line.text,
                            bold: line.isBold,
                            font: "Times New Roman",
                            size: 28 // 14pt
                        })],
                        spacing: { line: 360, before: 120 }
                    });
                })
            }));

            const blob = await Packer.toBlob(new Document({ sections }));
            saveAs(blob, "Ket_Qua_OCR_Chinh_Xac.docx");
        };
    </script>
</body>
</html>
